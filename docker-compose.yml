name: honest-broker
services:
  web:
    build: .
    image: honest-broker:demo-20261017-v1
    container_name: honest-broker
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64M
    cpus: 0.50
    pids_limit: 64
    networks: [caddy_net]
    expose: [8080]
    labels:
      caddy: broker.ilyamedve.dev
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy.encode: zstd gzip
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
networks:
  caddy_net:
    external: true
